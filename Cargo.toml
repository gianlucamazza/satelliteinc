[workspace]
resolver = "2"
members = ["crates/core", "crates/wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
authors = ["Gianluca Mazza"]
repository = "https://github.com/gianlucatruda/satelliteinc"

[workspace.dependencies]
satelliteinc-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
# Deliberate allowances:
float_cmp = "allow"                # bit-exact determinism tests compare with ==
cast_possible_truncation = "allow" # tick/sample counts, bounded by construction
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"       # applied by hand where dropping is a bug
module_name_repetitions = "allow"
unreadable_literal = "allow"       # orbital constants mirror published values
too_many_lines = "allow"
doc_markdown = "allow"
similar_names = "allow"            # r1/r2, dv1/dv2 are the domain's names
many_single_char_names = "allow"   # n, e, a, r, v: standard orbital notation
cast_precision_loss = "allow"      # tick counts / station counts, tiny by construction

# Optimize the shipped .wasm for size. Workspace-global: native release
# builds also get abort-on-panic (tests run in the dev profile).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
