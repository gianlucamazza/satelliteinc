[workspace]
resolver = "2"
members = ["crates/core", "crates/wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Gianluca Mazza"]
repository = "https://github.com/gianlucatruda/satelliteinc"

[workspace.dependencies]
satelliteinc-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# Optimize the shipped .wasm for size.
[profile.release]
opt-level = "s"
lto = true
