<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Satellite Inc</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="globe" aria-hidden="true"></canvas>
      <div id="loading" class="loading-overlay">
        <div class="loading-card">
          <h2>Satellite Inc</h2>
          <p id="loading-stage">Initializing…</p>
          <div class="loading-bar"><div id="loading-bar-fill" class="loading-bar-fill"></div></div>
        </div>
      </div>
      <div id="onboarding" class="onboarding hidden" role="dialog" aria-modal="true" aria-labelledby="onboarding-title">
        <div class="onboarding-card">
          <p id="onboarding-progress" class="onboarding-progress"></p>
          <h2 id="onboarding-title"></h2>
          <p id="onboarding-body"></p>
          <div class="onboarding-actions">
            <button type="button" id="onboarding-back" class="ghost">Back</button>
            <button type="button" id="onboarding-skip" class="ghost">Skip</button>
            <button type="button" id="onboarding-next" class="primary">Next</button>
          </div>
        </div>
      </div>
      <div id="endscreen" class="onboarding hidden" role="alertdialog" aria-labelledby="endscreen-title">
        <div class="onboarding-card">
          <h2 id="endscreen-title"></h2>
          <p id="endscreen-body"></p>
          <div class="onboarding-actions">
            <button type="button" id="endscreen-restart" class="primary">Restart campaign</button>
            <button type="button" id="endscreen-sandbox" class="ghost">Switch to sandbox</button>
            <button type="button" id="endscreen-continue" class="ghost">Continue playing</button>
          </div>
        </div>
      </div>
      <div id="camera-hint" class="camera-hint hidden">Drag to orbit · Scroll to zoom</div>
      <div id="view-fade"></div>
      <button type="button" id="view-toggle" class="view-toggle">System map (M)</button>
      <div id="sim-date" class="sim-date hidden"></div>
      <div id="map-tooltip" class="map-tooltip hidden"></div>
      <div id="map-infocard" class="map-infocard hidden"></div>
      <aside id="guided-overlay" class="guided-overlay hidden" aria-live="polite"></aside>
      <div id="globe-legend" class="globe-legend hidden" aria-label="Globe legend">
        <div><span class="lg-dot lg-satellite"></span> Satellite</div>
        <div><span class="lg-dot lg-pass"></span> In pass / station OK</div>
        <div><span class="lg-dot lg-station-idle"></span> Station (no pass)</div>
        <div><span class="lg-dot lg-downlink"></span> Downlinking / transfer</div>
        <div><span class="lg-dot lg-ref"></span> Reference sat (ISS, Earth only)</div>
        <div><span class="lg-line lg-orbit"></span> Orbit trail</div>
        <div><span class="lg-line dashed lg-design"></span> Design preview</div>
        <div><span class="lg-line lg-downlink-line"></span> Downlink line</div>
      </div>
      <div id="toast" class="toast" role="status" aria-live="assertive"></div>
      <!-- Top chrome: global telemetry + time control (not stacked in the left dock). -->
      <div id="hud-topbar" class="hud-topbar" aria-label="Mission priority">
        <div id="priority-strip" class="priority-strip"></div>
        <div id="time-toolbar" class="time-toolbar" aria-label="Time acceleration"></div>
        <p id="phase-label" class="phase-chip">Design Lab</p>
      </div>
      <aside id="hud" aria-label="Mission control HUD">
        <header class="hud-dock-header">
          <div class="hud-header-row">
            <h1>Satellite Inc</h1>
            <button type="button" id="hud-toggle" class="hud-toggle" aria-expanded="true" aria-label="Collapse mission control HUD">◀</button>
          </div>
        </header>
        <nav id="tab-bar" class="tab-bar" aria-label="Mission control"></nav>
        <section id="fleet-strip" class="fleet-strip" aria-label="Fleet"></section>
        <!-- Alerts + contract + craft telemetry (contextual). -->
        <section id="status-panel" class="hud-status"></section>
        <section id="action-panel" class="hud-actions"></section>
        <section id="event-log" class="hud-log" aria-label="Event log" aria-live="polite"></section>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
