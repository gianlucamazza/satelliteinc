# pnpm 11 requires an explicit allow-list for dependency build scripts.
# esbuild (Vite) and @swc/core (typescript-eslint) ship native binaries.
allowBuilds:
  "@swc/core": true
  esbuild: true

overrides:
  # Transitives Dependabot security-update jobs could not bump (2026-10-10/11):
  # source-map-js, uuid, brace-expansion, postcss. tinypool / @vitest/mocker
  # are covered by vitest 5.0.3 (tinypool dropped, mocker 5.0.3).
  postcss: ">=8.5.23"
  source-map-js: ">=1.2.2"
  brace-expansion: ">=5.0.12"
  uuid: ">=14.0.0"
