# cargo-deny configuration: RustSec advisories, license allow-list,
# duplicate-crate and source checks for the workspace.

[graph]
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "wasm32-unknown-unknown" },
]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unicode-3.0",
  "BSD-3-Clause",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
