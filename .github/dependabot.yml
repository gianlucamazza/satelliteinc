version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      wasm-bindgen:
        applies-to: security-updates
        patterns:
          - "wasm-bindgen"
          - "wasm-bindgen-*"
          - "js-sys"
          - "web-sys"
      serde:
        applies-to: security-updates
        patterns:
          - "serde"
          - "serde_derive"
      version-updates:
        applies-to: version-updates
        patterns: ['*']

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # TypeScript 7.0 has no JS compiler API. typescript-eslint 8.x
    # hard-fails (`versionMajor >= 7`). Support is tracked in
    # typescript-eslint#10940 (experimental TS 7.1 IPC, not released).
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      typescript-eslint:
        applies-to: security-updates
        patterns:
          - "typescript-eslint"
          - "@typescript-eslint/*"
      vitest:
        applies-to: security-updates
        patterns:
          - "vitest"
          - "@vitest/*"
      version-updates:
        applies-to: version-updates
        patterns: ['*']
